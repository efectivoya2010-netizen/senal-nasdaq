name: Chequeo de senal Nasdaq/Bitcoin

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos, todo el dia, todos los dias
  workflow_dispatch:         # tambien permite tocar "Run workflow" a mano para probar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr el chequeo de senal
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_signal.py

      - name: Guardar el estado (para no repetir el mismo aviso)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "actualiza estado de senal"
          git push
